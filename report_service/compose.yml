services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REPORT_API_KEY: ${REPORT_API_KEY:?Set REPORT_API_KEY in .env}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data: