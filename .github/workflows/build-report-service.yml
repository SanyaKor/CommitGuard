name: Build Report Service

on:
  push:
    branches: [main]
    paths:
      - "report_service/**"
      - ".github/workflows/build-report-service.yml"
  pull_request:
    paths:
      - "report_service/**"
      - ".github/workflows/build-report-service.yml"

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker build
        run: |
          docker build \
            --platform linux/amd64 \
            --tag report-service:test \
            ./report_service

  publish:
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      permissions:
        contents: read
        packages: write

      env:
        IMAGE: ghcr.io/sanyakor/report-service

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker image
          run: |
            docker build \
              --platform linux/amd64 \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$IMAGE:main" \
              --tag "$IMAGE:sha-$GITHUB_SHA" \
              ./report_service

        - name: Log in to GHCR
          env:
            GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

        - name: Publish Docker image
          run: |
            docker push "$IMAGE:sha-$GITHUB_SHA"
            docker push "$IMAGE:main"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: report-service-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy API
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          cd "$HOME/commitguard"

          image="ghcr.io/sanyakor/report-service:sha-$1"

          sudo -n env REPORT_IMAGE="$image" docker compose pull api
          sudo -n env REPORT_IMAGE="$image" docker compose up \
            -d --no-deps --wait --wait-timeout 60 api

          sudo -n docker compose ps
          REMOTE

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key